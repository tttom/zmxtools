version: 2

build:
  os: ubuntu-22.04
  tools:
    python: '3.12'
  jobs:
    create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
      - uv venv
    install:
      - uv sync --extra docs
    build:
      html:
        - uv run sphinx-build -T -b html docs docs/_build/html

sphinx:
  configuration: 'docs/conf.py'
  fail_on_warning: true

formats:
  - pdf
  - epub
  - htmlzip

submodules:
  include: all
