# All configuration for plugins and other utils is defined here.
# Read more about `setup.cfg`:
# https://docs.python.org/3/distutils/configfile.html

[flake8]
# Base flake8 configuration:
# https://flake8.pycqa.org/en/latest/user/configuration.html
format = wemake
show-source = true
statistics = false
doctests = true

# darglint configuration:
# https://github.com/terrencepreilly/darglint
strictness = long
docstring-style = numpy

# Plugins:
max-complexity = 6
max-line-length = 120

# wemake-python-styleguide settings:
i-control-code = false

# Disable some pydocstyle checks and exclude some pydoctest checks globally:
ignore = C901, DAR103, DAR203, D100, D104, D106, D200, D401, E731, NIP323, N802, N803, N806, RST214, RST303, RST304, S101,
  WPS110, WPS111,
  WPS201, WPS202, WPS204, WPS208, WPS210, WPS211, WPS220, WPS212, WPS213, WPS214, WPS221, WPS226, WPS229,
  WPS230, WPS231, WPS232, WPS236, WPS237,
  WPS303, WPS305, WPS309, WPS317, WPS318, WPS323, WPS332, WPS336, WPS346, WPS347, WPS350, WPS362,
  WPS404, WPS410, WPS414, WPS420, WPS432, WPS430, WPS433, WPS459, WPS468,
  WPS507, WPS509, WPS529,
  W504, WPS602, WPS112,
  X100

# Excluding some directories:
exclude =
  .git
  __pycache__
  venv
  .venv
  .eggs
  *.egg

# Ignoring some errors in some files:
per-file-ignores =
  # Enable `assert` keyword and magic numbers for tests:
  tests/*.py: S101, WPS226, WPS432


[isort]
# isort configuration:
# https://github.com/timothycrosley/isort/wiki/isort-Settings
include_trailing_comma = true
use_parentheses = true
# See https://github.com/timothycrosley/isort#multi-line-output-modes
multi_line_output = 3
line_length = 120
profile = wemake


[tool:pytest]
# Directories that are not visited by pytest collector:
norecursedirs = *.egg .eggs dist build docs .tox .git __pycache__

# Strict `@xfail` by default:
xfail_strict = true

# Extra options:
addopts =
  --strict-markers
  --strict-config
  --tb=short
  --doctest-modules
  --cov=zmxtools
  --cov-report=term:skip-covered
  --cov-report=html
  --cov-report=xml
  --cov-branch
  --cov-fail-under=90


[mypy]
# mypy configurations: https://mypy.readthedocs.io/en/latest/config_file.html
plugins = pydantic.mypy, numpy.typing.mypy_plugin, mypy_einsum
allow_redefinition = False
check_untyped_defs = True
disallow_any_explicit = True
disallow_any_generics = True
disallow_untyped_calls = True
ignore_errors = False
ignore_missing_imports = True
implicit_reexport = False
local_partial_types = True
strict_optional = True
strict_equality = True
no_implicit_optional = True
warn_no_return = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_unused_configs = True
warn_unreachable = True


[doc8]
# doc8 configuration: https://pypi.org/project/doc8/
ignore-path = docs/_build
max-line-length = 120
sphinx = True
