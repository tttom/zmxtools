[project]
name = "zmxtools"
description = "Toolkit to read Zemax OpticStudio files."
version = "0.3.0"
license = "AGPL-3.0-only"
authors = [
  { name = "Tom Vettenburg", email = "tom.vettenburg@gmail.com" },
  { name = "Wouter Vermaelen" },
]
readme = "README.md"
requires-python = ">=3.13"
keywords = [
  "Optical Design", "Lens Design", "Zemax", "Zemax Optic Studio Archive (ZAR)",
  "Zemax Optic Studio Lens File (ZMX)", "Zemax Optic Studio ASCII Glass Files (AGF)",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "importlib_metadata>=8.6.1",
  "coloredlogs>=15.0.1",
  "numpy>=2.2.2",
  "typing_extensions>=4.12",
]

[project.urls]
Homepage = "https://github.com/tttom/zmxtools"
Repository = "https://github.com/tttom/zmxtools"
Documentation = "https://zmxtools.readthedocs.io"
Changelog = "https://github.com/tttom/zmxtools/blob/main/CHANGELOG.md"

[project.scripts]
unzar = "zmxtools.cli:unzar"
oshow = "zmxtools.gui:oshow"

[project.optional-dependencies]
docs = [
  "sphinx>=7.4.7",
  "sphinx-autodoc-typehints>=2.3.0",
  "sphinx-rtd-theme>=2.0.0",
  "m2r2>=0.3.3",
]

[dependency-groups]
dev = [
  "pytest>=8.3.3",
  "pytest-cov>=5.0.0",
  "ty>=0.0.1",
  "ruff>=0.8.0",
  "doc8>=1.1.0",
]
docs = [
  "sphinx>=7.4.7",
  "sphinx-autodoc-typehints>=2.3.0",
  "sphinx-rtd-theme>=2.0.0",
  "m2r2>=0.3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zmxtools"]

[tool.hatch.build.targets.sdist]
include = ["zmxtools", "tests", "docs", "README.md", "CHANGELOG.md", "CONTRIBUTING.md"]

[tool.pytest.ini_options]
norecursedirs = ["*.egg", ".eggs", "dist", "build", "docs", ".tox", ".git", "__pycache__"]
xfail_strict = true
addopts = [
  "--strict-markers",
  "--strict-config",
  "--tb=short",
  "--doctest-modules",
  "--cov=zmxtools",
  "--cov-report=term:skip-covered",
  "--cov-report=html",
  "--cov-report=xml",
  "--cov-branch",
  "--cov-fail-under=95",
]

[tool.coverage.run]
branch = true
source = ["zmxtools"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ty.src]
exclude = ["docs"]

[tool.ty.rules]
unresolved-import = "ignore"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["docs/_build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "D", "RUF"]
ignore = [
  "D100", "D104", "D106", "D200", "D203", "D212", "D401",
  "E501", "N802", "N803", "N806", "B008",
]
allowed-confusables = ["α", "ρ"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103", "S101"]
"zmxtools/__init__.py" = ["E402"]
