[tool.poetry]
name = "zmxtools"
description = "Toolkit to read Zemax OpticStudio files."
version = "0.3.0"
license = "AGPL3"
authors = ["Tom Vettenburg <tom.vettenburg@gmail.com>", "Wouter Vermaelen"]
readme = "README.md"
repository = "https://github.com/tttom/zmxtools"
keywords = ["Optical Design", "Lens Design", "Zemax", "Zemax Optic Studio Archive (ZAR)",
  "Zemax Optic Studio Lens File (ZMX)", "Zemax Optic Studio ASCII Glass Files (AGF)"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Topic :: Scientific/Engineering :: Physics"]


[tool.poetry.dependencies]
python = "^3.11.4"
importlib_metadata = "^8.5.0"
coloredlogs = "^15.0.1"
numpy = "^2.1.1"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
sphinx = "^7.4.7"
sphinx-autodoc-typehints = "^2.3.0"
sphinx_rtd_theme = "^2.0.0"
tomli = "^2.0"
#doc8 = "^1.0"
m2r2 = "^0.3.3"

[tool.poetry.group.dev.dependencies]
mypy = "^1.7"
charset-normalizer = "^3.3.2"
certifi = "^2024.8.30"
idna = "^3.6"
pyparsing = "^3.1.1"

wemake-python-styleguide = "^0.19.2"
flake8-pytest-style = "^2.0.0"
safety = "^3.2.8"

pytest = "^8.3.3"
pytest-cov = "^5.0.0"
pytest-randomly = "^3.15.0"


[tool.poetry.scripts]
unzar = "zmxtools.cli:unzar"


[[tool.poetry.source]]
name = "pypi-test"
url = "https://test.pypi.org/simple/"
default = false
secondary = false


[build-system]
requires = ["poetry-core>=1.6.0"]
build-backend = "poetry.core.masonry.api"


[tool.nitpick]
style = "https://raw.githubusercontent.com/wemake-services/wemake-python-styleguide/master/styles/nitpick-style-wemake.toml"


